# Three ClickHouse nodes sharing one image, entrypoint wrapper and healthcheck;
# only identity, ports and storage differ per node. The wrapper exists because
# Compose container names do not yield a usable ordinal - these end in -1,
# -2-1 and -3-1, so ${HOSTNAME##*-} would be 1 for every one of them.
x-clickhouse: &clickhouse
  image: clickhouse/clickhouse-server:24.8
  entrypoint: ["/bin/sh", "-ec"]
  # $$ is Compose's escape for a literal $: without it ${...} here is
  # interpolated by Compose from the shell environment - blank, as its
  # "variable is not set" warnings showed - instead of reaching the shell.
  # command, not args: args is Kubernetes, Compose passes the script as CMD.
  command:
    - |
      sed -e "s/@NODE_ID@/$${CLICKHOUSE_NODE_ID}/g" \
          -e "s/@REPLICA@/$${CLICKHOUSE_REPLICA}/g" \
          /config/cluster.xml > /etc/clickhouse-server/config.d/010-cluster.xml
      exec /entrypoint.sh
  ulimits:
    nofile:
      soft: 262144
      hard: 262144
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping >/dev/null 2>&1"]
    interval: 5s
    timeout: 5s
    retries: 30

services:
  # Three Kafka brokers in KRaft combined mode: three voters, RF=3, so losing
  # one broker costs an ISR contraction and a leader move, not availability.
  #
  # Broker 1's service is `kafka`, not `kafka-1`, and that is deliberate: the
  # running broker already owns the container name pubsub-kafka-1 and the
  # anonymous volume holding the topics, and Compose only reuses a container
  # when the service name still matches. Renaming the service would orphan
  # that volume and silently start an empty cluster. scripts/chaos.sh also
  # addresses pubsub-kafka-1 by name at four call sites. The other two are
  # kafka-2 / kafka-3; container_name pins all three so the names stay
  # pubsub-kafka-1/2/3 instead of pubsub-kafka-2-1.
  #
  # Two listeners per broker, and the CLIENT port differs per broker:
  #
  #   CLIENT    what a process on the host connects to. Its port is the same
  #             inside the container as on the host, so a broker's own
  #             healthcheck and its advertised address agree. If broker 2
  #             listened on 9092 internally but advertised localhost:9094, its
  #             healthcheck would follow that metadata to a port nothing in
  #             its container is listening on.
  #   INTERNAL  how the brokers reach each other over the Compose network,
  #             under their service names. Without this split a broker would
  #             hand its peers the address a client reached *it* on - i.e.
  #             localhost - which resolves to the wrong container.
  #   CONTROLLER  the Raft quorum, never published to the host.
  kafka:
    image: apache/kafka:3.9.0
    container_name: pubsub-kafka-1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_LISTENERS: INTERNAL://:29092,CLIENT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,CLIENT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CLIENT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Bounded rather than the JVM default: three brokers share the WSL VM
      # with PostgreSQL, ClickHouse and eleven Go processes, and an unbounded
      # heap is the one thing that can take the pool out from under all of them.
      KAFKA_HEAP_OPTS: -Xmx1G -Xms1G
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-2:
    image: apache/kafka:3.9.0
    container_name: pubsub-kafka-2
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_LISTENERS: INTERNAL://:29092,CLIENT://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:29092,CLIENT://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CLIENT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xmx1G -Xms1G
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-2:29092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-3:
    image: apache/kafka:3.9.0
    container_name: pubsub-kafka-3
    ports:
      - "9095:9095"
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_LISTENERS: INTERNAL://:29092,CLIENT://:9095,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:29092,CLIENT://localhost:9095
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CLIENT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xmx1G -Xms1G
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-3:29092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  # Primary. The entrypoint wrapper appends `host replication all all` to
  # pg_hba.conf on every start: the stock image only allows replication from
  # 127.0.0.1, and `host all all all` does not cover replication requests -
  # PostgreSQL matches those against a `replication` database entry, so a base
  # backup from another container fails outright. The init scripts in
  # /docker-entrypoint-initdb.d cannot do this, because they only run against
  # an empty data directory and this primary already has one.
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: pubsub
      POSTGRES_PASSWORD: pubsub
      POSTGRES_DB: pubsub
    entrypoint: ["/bin/sh", "/usr/local/bin/pg-primary.sh"]
    # Explicit: overriding entrypoint without a command left Cmd empty, and
    # docker-entrypoint.sh then execs nothing and exits 0 - a container that
    # looks like it started and did not.
    command: ["postgres"]
    volumes:
      - ./scripts/pg-primary.sh:/usr/local/bin/pg-primary.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pubsub -d pubsub"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Two streaming replicas, asynchronous: the primary commits without waiting
  # for either. Synchronous replication would add two network hops to every
  # commit, and throughput is concurrency over latency - that raises the
  # latency floor and so lowers max ev/s, for data (inbox, presence, registry)
  # that is reconstructable. The cost of async is that a primary dying before
  # WAL ships can lose the last few transactions.
  #
  # `user: postgres` so pg_basebackup writes files postgres can use; running as
  # root would leave a root-owned data directory. Each takes one base backup
  # on first start - the existing primary's data included - then serves reads.
  # Replica ports are published so processes on the host can reach them; the
  # platform runs as host processes, not containers, so Compose networking
  # alone would not.
  postgres-2:
    image: postgres:16-alpine
    user: postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: pubsub
      POSTGRES_PASSWORD: pubsub
      POSTGRES_DB: pubsub
    entrypoint: ["/bin/sh", "/usr/local/bin/pg-replica.sh"]
    command: ["postgres"]
    volumes:
      - ./scripts/pg-replica.sh:/usr/local/bin/pg-replica.sh:ro
      - pg2-data:/var/lib/postgresql/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pubsub -d pubsub"]
      interval: 5s
      timeout: 10s
      retries: 60

  postgres-3:
    image: postgres:16-alpine
    user: postgres
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: pubsub
      POSTGRES_PASSWORD: pubsub
      POSTGRES_DB: pubsub
    entrypoint: ["/bin/sh", "/usr/local/bin/pg-replica.sh"]
    command: ["postgres"]
    volumes:
      - ./scripts/pg-replica.sh:/usr/local/bin/pg-replica.sh:ro
      - pg3-data:/var/lib/postgresql/data
    # After postgres-2 as well as the primary: two base backups running at
    # once killed one of their own temporary replication slots -
    #
    #   terminating process 43 to release replication slot "pg_basebackup_43"
    #   DETAIL: The slot's restart_lsn 0/5F000000 exceeds the limit by 16777216 bytes
    #
    # even with max_slot_wal_keep_size at -1. Serialising makes the second
    # backup deterministic and costs one healthcheck interval at setup time.
    depends_on:
      postgres:
        condition: service_healthy
      postgres-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pubsub -d pubsub"]
      interval: 5s
      timeout: 10s
      retries: 60

  # Node 1 also publishes the ports CH_DSN points at. Every node holds every
  # row, so any of them could serve them - but the DSN names one host, which
  # is the same limitation PG_DSN has and is documented as such: losing this
  # container costs the endpoint, not the data.
  clickhouse:
    <<: *clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_USER: pubsub
      CLICKHOUSE_PASSWORD: pubsub
      CLICKHOUSE_DB: pubsub
      CLICKHOUSE_NODE_ID: "1"
      CLICKHOUSE_REPLICA: "1"
    volumes:
      - ./docker/clickhouse-cluster.xml:/config/cluster.xml:ro
      - clickhouse1-data:/var/lib/clickhouse

  clickhouse-2:
    <<: *clickhouse
    environment:
      CLICKHOUSE_USER: pubsub
      CLICKHOUSE_PASSWORD: pubsub
      CLICKHOUSE_DB: pubsub
      CLICKHOUSE_NODE_ID: "2"
      CLICKHOUSE_REPLICA: "2"
    volumes:
      - ./docker/clickhouse-cluster.xml:/config/cluster.xml:ro
      - clickhouse2-data:/var/lib/clickhouse

  clickhouse-3:
    <<: *clickhouse
    environment:
      CLICKHOUSE_USER: pubsub
      CLICKHOUSE_PASSWORD: pubsub
      CLICKHOUSE_DB: pubsub
      CLICKHOUSE_NODE_ID: "3"
      CLICKHOUSE_REPLICA: "3"
    volumes:
      - ./docker/clickhouse-cluster.xml:/config/cluster.xml:ro
      - clickhouse3-data:/var/lib/clickhouse

  # Prometheus and Grafana exist so that the metrics the eight services expose
  # on /metrics have somewhere to land - an endpoint nobody scrapes is not
  # observability. They are the only two containers here that are not part of
  # the platform: the services run on the host under scripts/supervise.sh, which
  # is why the scrape targets point at the host rather than at each other.
  prometheus:
    image: prom/prometheus:v3.15.1
    ports:
      # 9090 is the harness's webhook receiver, so Prometheus takes 9091.
      - "9091:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      # Resolves host.docker.internal to the host the services listen on. Docker
      # Desktop provides that name; Docker Engine on Linux does not, without this.
      - "host.docker.internal:host-gateway"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # 30d so that increase()[1d] and [7d] have samples to work with - the
      # two-hour default answers "today" and nothing longer.
      - --storage.tsdb.retention.time=30d
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.5
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      # Provisioned rather than clicked in, so a fresh `docker compose up` has a
      # data source instead of a setup step.
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

# Named rather than anonymous: each holds a base backup taken once from the
# primary, and that copy is not reproducible from anywhere else if the volume
# is orphaned.
volumes:
  pg2-data:
  pg3-data:
  prometheus-data:
  grafana-data:
  # Named rather than anonymous: each holds a node's ClickHouse data, and an
  # orphaned anonymous volume is easy to lose without noticing.
  clickhouse1-data:
  clickhouse2-data:
  clickhouse3-data:
