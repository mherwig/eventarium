{{/*
ClickHouse: one server. Status queries and the status writer talk to it over
the native port 9000, the probe over HTTP 8123.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pubsub-infra.clickhouseService" . }}
  labels:
    {{- include "pubsub-infra.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8123
      targetPort: http
    - name: native
      port: 9000
      targetPort: native
  selector:
    {{- include "pubsub-infra.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "pubsub-infra.clickhouseService" . }}
  labels:
    {{- include "pubsub-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
spec:
  serviceName: {{ include "pubsub-infra.clickhouseService" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "pubsub-infra.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: clickhouse
  template:
    metadata:
      labels:
        {{- include "pubsub-infra.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: clickhouse
    spec:
      containers:
        - name: clickhouse
          image: "{{ .Values.clickhouse.image.repository }}:{{ .Values.clickhouse.image.tag }}"
          imagePullPolicy: {{ .Values.clickhouse.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8123
            - name: native
              containerPort: 9000
          env:
            - name: CLICKHOUSE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "pubsub-infra.credentialsSecret" . }}
                  key: CLICKHOUSE_USER
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pubsub-infra.credentialsSecret" . }}
                  key: CLICKHOUSE_PASSWORD
            - name: CLICKHOUSE_DB
              valueFrom:
                secretKeyRef:
                  name: {{ include "pubsub-infra.credentialsSecret" . }}
                  key: CLICKHOUSE_DB
          resources:
            {{- toYaml .Values.clickhouse.resources | nindent 12 }}
          # /ping answers before the server is fully up, which is exactly
          # what readiness should mean here; liveness uses the same endpoint
          # so a wedged process is restarted rather than probed forever.
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
          # Deviation from compose: it sets nofile to 262144 for the burst of
          # status inserts, and the Kubernetes API has no ulimit field at all
          # (checked against core/v1 types), so the container runs on whatever
          # default the node gives it. Worth revisiting if the status writer
          # ever hits "too many open files".
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        {{- if .Values.clickhouse.storageClass }}
        storageClassName: {{ .Values.clickhouse.storageClass | quote }}
        {{- end }}
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.clickhouse.storage }}
