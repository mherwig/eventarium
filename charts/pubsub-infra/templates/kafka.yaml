{{/*
Kafka: one KRaft node that is broker and controller at once.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pubsub-infra.kafkaService" . }}
  labels:
    {{- include "pubsub-infra.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: client
      port: 9092
      targetPort: client
  selector:
    {{- include "pubsub-infra.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: kafka
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "pubsub-infra.kafkaService" . }}
  labels:
    {{- include "pubsub-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka
spec:
  serviceName: {{ include "pubsub-infra.kafkaService" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "pubsub-infra.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: kafka
  template:
    metadata:
      labels:
        {{- include "pubsub-infra.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: kafka
    spec:
      # The image runs as uid 1000 (appuser) and writes to the claim below;
      # fsGroup makes the fresh volume writable by it without a chown step.
      securityContext:
        fsGroup: 1000
      containers:
        - name: kafka
          image: "{{ .Values.kafka.image.repository }}:{{ .Values.kafka.image.tag }}"
          imagePullPolicy: {{ .Values.kafka.image.pullPolicy }}
          ports:
            - name: client
              containerPort: 9092
            - name: controller
              containerPort: 9093
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            # Broker and controller are this same process, so the quorum
            # address stays on the pod: pointing it at the service name above
            # deadlocks. A Service only has endpoints once the pod is Ready,
            # and the pod only becomes Ready once the broker has registered
            # with the controller - which it cannot reach without an
            # endpoint. Compose has no readiness gating, which is exactly
            # why the identical config worked there.
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@localhost:9093
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:9092,CONTROLLER://:9093
            # Advertised, not listened: every consumer is handed this name and
            # dials it from its own pod, so it must be the service DNS name -
            # "localhost" works in compose and fails in a cluster.
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://{{ include "pubsub-infra.kafkaService" . }}:9092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            # One broker: replication factors above 1 would never elect an ISR.
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            # The admin job creates every topic with its own retention; the
            # spike relies on that instead of implicit topic creation.
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data
          resources:
            {{- toYaml .Values.kafka.resources | nindent 12 }}
          # A probe that needs no shell: the image has one, but tcp keeps the
          # liveness story identical across the three stores.
          readinessProbe:
            tcpSocket:
              port: client
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: client
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        {{- if .Values.kafka.storageClass }}
        storageClassName: {{ .Values.kafka.storageClass | quote }}
        {{- end }}
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.kafka.storage }}
