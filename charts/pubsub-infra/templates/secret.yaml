apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pubsub-infra.credentialsSecret" . }}
  labels:
    {{- include "pubsub-infra.labels" . | nindent 4 }}
type: Opaque
data:
  # The app chart reads these through its own config secret; they live here
  # because the stores are the ones that create the accounts.
  POSTGRES_USER: {{ .Values.postgres.username | b64enc | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | b64enc | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | b64enc | quote }}
  CLICKHOUSE_USER: {{ .Values.clickhouse.username | b64enc | quote }}
  CLICKHOUSE_PASSWORD: {{ .Values.clickhouse.password | b64enc | quote }}
  CLICKHOUSE_DB: {{ .Values.clickhouse.database | b64enc | quote }}
