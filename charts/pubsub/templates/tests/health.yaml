{{/*
Run with `helm test <release>`: proves the wiring, not the logic - a pod
that can reach an API through its Service and a worker through /readyz.
distroless has no shell to exec into, so this uses a tiny image with wget.
*/}}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "pubsub.fullname" . }}-test
  labels:
    {{- include "pubsub.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
    - name: probe
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
        - |
          set -e
          echo "publish-api /healthz:"
          wget -qO- http://{{ include "pubsub.fullname" . }}-publish-api:{{ index .Values.components "publish-api" "port" }}/healthz
          echo
          echo "dispatcher /readyz (needs PostgreSQL):"
          wget -qO- http://{{ include "pubsub.fullname" . }}-dispatcher:{{ index .Values.components "dispatcher" "port" }}/readyz
          echo
          echo "sse-gateway /healthz:"
          wget -qO- http://{{ include "pubsub.fullname" . }}-sse-gateway:{{ index .Values.components "sse-gateway" "port" }}/healthz
          echo
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65532
        capabilities:
          drop: ["ALL"]
