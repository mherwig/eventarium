{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pubsub.fullname" . }}-config
  labels:
    {{- include "pubsub.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.config }}
  {{- if $value }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
{{- end }}
